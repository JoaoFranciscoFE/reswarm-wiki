site_name: "Re://:Swarm Wiki"
# site_url: https://SEU-USUARIO.github.io/NOME-DO-REPOSITORIO/
use_directory_urls: false
theme:
  name: material
  language: en
  font:
    text: Rubik
    code: Roboto Mono
  features: [search.suggest, search.highlight, navigation.top, navigation.instant]
  palette:
    - scheme: slate
      primary: amber
      accent: amber
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: amber
      accent: amber
      toggle: {icon: material/brightness-7, name: Dark mode}
plugins:
  - search
  - tags
markdown_extensions:
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
extra_css: [stylesheets/extra.css, stylesheets/fandom.css]
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
copyright: "Content adapted from the Bee Swarm Simulator Wiki (Fandom), licensed under CC BY-SA 3.0."
