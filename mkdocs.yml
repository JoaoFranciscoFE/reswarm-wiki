site_name: "Re://:Swarm Wiki"
site_url: https://reswarm.org/
use_directory_urls: false
theme:
  name: material
  language: en
  features: [search.suggest, search.highlight, navigation.top, navigation.instant]
  palette:
    - scheme: slate
      primary: amber
      accent: amber
      toggle: {icon: material/brightness-4, name: Light mode}
    - scheme: default
      primary: amber
      accent: amber
      toggle: {icon: material/brightness-7, name: Dark mode}
plugins:
  - search
  - tags
markdown_extensions:
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true
extra_css: [stylesheets/extra.css]
copyright: "Content adapted from the Bee Swarm Simulator Wiki (Fandom), licensed under CC BY-SA 3.0."
